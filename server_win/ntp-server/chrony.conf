# Use local system clock as time source (no internet needed)
local stratum 8

# Allow local network to query this server
allow 192.168.0.0/16
allow 172.16.0.0/12
allow 10.0.0.0/8
allow 127.0.0.1

# Drift file to track clock accuracy
driftfile /var/lib/chrony/drift

# Allow large time adjustments
makestep 1 3

# Log directory
logdir /var/log/chrony
<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Manager</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="resources/css/style.css" type="text/css">
    <script src="resources/js/mqtt_lib/mqtt.min.js"></script>
    <script src="resources/js/mqtt_server_info.js"></script>
    <script src="resources/js/http_methods.js"></script>
    <script src="resources/js/mqtt_handle.js"></script>
    <script src="resources/js/db_server_infor.js"></script>
    <script src="resources/js/chart_lib/dist/chart.umd.min.js"></script>
    <!-- Then load your custom chart file -->
    <script src="/resources/js/sortWorker.js"></script>
    <script src="/resources/js/chart_handle.js"></script> 
    <script src="/resources/js/device_manager.js"></script>
    <script src="/resources/js/history_table_handle.js"></script>
    <script src="/resources/js/db_handle.js"></script>
    <script src="/resources/js/control_table_handle.js"></script>

</head>
<body>
    <div id="deviceListView">
        <h1>Devices</h1>
        <table class="devices-container"></table>
    </div>

    <div id="deviceDetailView" class="device-detail">
        <button class="back-btn" onclick="showDeviceList();">← Back to Devices</button>
        
        <div class="detail-header">
            <h2 id="deviceName">Device 1</h2>
            <span id="deviceStatus" class="status-badge status-offline">Offline</span>
        </div>

        <div class="info-section">
            <h3>Device Information</h3>
            <div class="info-item">
                <span class="info-label">Device ID:</span>
                <span class="info-value" id="deviceId">DEV-001</span>
            </div>
            <div class="info-item">
                <span class="info-label">MAC Address:</span>
                <span class="info-value" id="macAddress">AA:BB:CC:DD:EE:FF</span>
            </div>
            <div class="info-item">
                <span class="info-label">Device IP:</span>
                <span class="info-value" id="deviceIp">192.168.1.1</span>
            </div>
            <div class="info-item">
                <span class="info-label">Sample Rate:</span>
                <span class="info-value" id="SR">1</span>
            </div>
            <div class="info-item">
                <span class="info-label">Reset times:</span>
                <span class="info-value" id="RT">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Last Updated:</span>
                <span class="info-value" id="lastUpdated">2 minutes ago</span>
            </div>

        </div>

        <div class="info-section">
            <h3>Recent Data</h3>
            <ul class="data-list" id="deviceData">
                <li>Temperature: --</li>
                <li>Time: --</li>
            </ul>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="switchTab('chart');">Chart</button>
            <!-- <button class="tab-btn" onclick="switchTab('history'); sort_table();">History</button> -->
            <!-- <button class="tab-btn" onclick="switchTab('history'); sortViewportWindow();">History</button> -->
            <button class="tab-btn" onclick="switchTab('history');">History</button>
            <button class="tab-btn" onclick="switchTab('control');" >Control</button>
        </div>


        <!-- Chart Tab -->
        <div id="chartTab" class="tab-content active">
            <div class="chart-container">
                <canvas class="tempChart" id="temperatureChart"></canvas>
            </div>
        </div>
        <!-- History Tab -->
        <div id="historyTab" class="tab-content">
        <div class="history-container" id="historyScroll">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Time</th>
                        <th>Temperature</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #999;">
                            No data available
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        </div>
        <!-- <div id="historyTab" class="tab-content">
            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Time</th>
                            <th>Temperature</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="3" style="text-align: center; color: #999;">No data available</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div> -->
        <!-- Control Tab -->
        <div id="controlTab" class="tab-content">
            <div class="control-container">
                <table class="control-table" style="border: 1px;">
                    <tbody id="controlTableBody">
                        <tr>
                            <th><label>Sample rate: </label></th>
                            <th><input class="control-table-lb" type="number" style="width: 80%;"></th>
                            <th><button class="control-table-btn" onclick="SR_button_handle()" style="width: auto" >Submit</button></th>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <script>
        
    </script>
</body>
</html>

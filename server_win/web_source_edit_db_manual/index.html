<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }
    
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    input[type="number"] {
      padding: 10px;
      border: 2px solid #e1e8ed;
      border-radius: 6px;
      font-size: 1em;
      width: 100px;
    }
    
    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
    }
    
    button.danger {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    
    .devices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .device-card {
      background: #f7f9fc;
      border-radius: 10px;
      padding: 20px;
      border: 2px solid #e1e8ed;
      transition: all 0.3s;
    }
    
    .device-card:hover {
      border-color: #667eea;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
    }
    
    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e1e8ed;
    }
    
    .device-id {
      font-size: 1.5em;
      font-weight: bold;
      color: #667eea;
    }
    
    .device-devid {
      color: #999;
      font-size: 0.9em;
    }
    
    .data-section {
      margin: 15px 0;
    }
    
    .data-label {
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    
    .data-values {
      background: white;
      padding: 10px;
      border-radius: 5px;
      min-height: 40px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      color: #666;
    }
    
    .input-group {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }
    
    .input-group input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .input-group button {
      padding: 8px 15px;
      font-size: 0.9em;
    }
    
    .delete-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8em;
    }
    
    .delete-btn:hover {
      background: #ff5252;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
      padding: 20px;
      background: #f7f9fc;
      border-radius: 10px;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }
    
    .stat-label {
      color: #999;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔌 Device Manager</h1>
    <p class="subtitle">Manage IoT Devices with Temperature & Time Data</p>
    
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="totalDevices">0</div>
        <div class="stat-label">Total Devices</div>
      </div>
    </div>
    
    <div class="controls">
      <input type="number" id="deviceCount" value="1" min="1" max="50" placeholder="Count">
      <button onclick="createDevices()">➕ Create Devices</button>
      <button onclick="loadDevices()">🔄 Refresh</button>
      <button class="danger" onclick="deleteAllDevices()">🗑️ Delete All</button>
    </div>
    
    <div id="devicesContainer"></div>
  </div>

  <script>
    const API = 'http://192.168.1.106:3000/api/devices';
    
    // Load devices on start
    loadDevices();
    
    async function loadDevices() {
      try {
        const response = await fetch(API);
        const devices = await response.json();
        
        document.getElementById('totalDevices').textContent = devices.length;
        
        const container = document.getElementById('devicesContainer');
        
        if (devices.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h2>No Devices Yet</h2>
              <p>Create devices using the controls above</p>
            </div>
          `;
          return;
        }
        
        container.innerHTML = '<div class="devices-grid">' + devices.map(device => `
          <div class="device-card">
            <div class="device-header">
              <div>
                <div class="device-id">Device #${device.id}</div>
                <div class="device-devid">${device.devId}</div>
              </div>
              <button class="delete-btn" onclick="deleteDevice(${device.id})">Delete</button>
            </div>
            
            <div class="data-section">
              <div class="data-label">🌡️ Temperature:</div>
              <div class="data-values">${device.temp.length > 0 ? device.temp.join(', ') : 'No data'}</div>
              <div class="input-group">
                <input type="number" id="temp-${device.id}" placeholder="e.g. 3000">
                <button onclick="addTemp(${device.id})">Add</button>
              </div>
            </div>
            
            <div class="data-section">
              <div class="data-label">⏰ Time:</div>
              <div class="data-values">${device.time.length > 0 ? device.time.join(', ') : 'No data'}</div>
              <div class="input-group">
                <input type="text" id="time-${device.id}" placeholder="e.g. 10:30">
                <button onclick="addTime(${device.id})">Add</button>
              </div>
            </div>
          </div>
        `).join('') + '</div>';
        
      } catch (error) {
        console.error('Error loading devices:', error);
        alert('Error loading devices!');
      }
    }
    
    async function createDevices() {
      const count = parseInt(document.getElementById('deviceCount').value);
      
      if (count < 1 || count > 50) {
        alert('Please enter a number between 1 and 50');
        return;
      }
      
      try {
        const response = await fetch(`${API}/bulk`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ count })
        });
        
        if (response.ok) {
          loadDevices();
        }
      } catch (error) {
        console.error('Error creating devices:', error);
        alert('Error creating devices!');
      }
    }
    
    async function addTemp(deviceId) {
      const input = document.getElementById(`temp-${deviceId}`);
      const temp = parseFloat(input.value);
      
      if (isNaN(temp)) {
        alert('Please enter a valid number');
        return;
      }
      
      try {
        const response = await fetch(`${API}/${deviceId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ temp })
        });
        
        if (response.ok) {
          input.value = '';
          loadDevices();
        }
      } catch (error) {
        console.error('Error updating temperature:', error);
        alert('Error updating temperature!');
      }
    }
    
    async function addTime(deviceId) {
      const input = document.getElementById(`time-${deviceId}`);
      const time = input.value.trim();
      
      if (!time) {
        alert('Please enter a time value');
        return;
      }
      
      try {
        const response = await fetch(`${API}/${deviceId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ time })
        });
        
        if (response.ok) {
          input.value = '';
          loadDevices();
        }
      } catch (error) {
        console.error('Error updating time:', error);
        alert('Error updating time!');
      }
    }
    
    async function deleteDevice(deviceId) {
      if (!confirm(`Delete Device #${deviceId}?`)) {
        return;
      }
      
      try {
        const response = await fetch(`${API}/${deviceId}`, {
          method: 'DELETE'
        });
        
        if (response.ok) {
          loadDevices();
        }
      } catch (error) {
        console.error('Error deleting device:', error);
        alert('Error deleting device!');
      }
    }
    
    async function deleteAllDevices() {
      if (!confirm('⚠️ Delete ALL devices? This cannot be undone!')) {
        return;
      }
      
      try {
        const response = await fetch(API, {
          method: 'DELETE'
        });
        
        if (response.ok) {
          loadDevices();
        }
      } catch (error) {
        console.error('Error deleting devices:', error);
        alert('Error deleting devices!');
      }
    }
  </script>
</body>
</html>
